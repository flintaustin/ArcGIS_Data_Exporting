<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Exporting</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.33/esri/themes/light/main.css" />

<script>

window.EXPORTER_CONFIG = {
  title: 'Data Exporting',

  groupId: '8345f85ae87e44238044f80e91fd4f4d',
  allowGroupSwitching: true,
  rememberGroup: true,
  groupItemTypes: ['Feature Service', 'Map Service'],

  layers: [],
  startLayersOn: true,
  allowAddingLayers: true,
  maxFeaturesPerLayer: 10000,
  maxResultsListed: 100,

  basemap: 'topo-vector',
  center: [-64.93, 18.34],
  zoom: 12,

  // Optional OAuth app. Leave blank to use the built-in username/password dialog,
  // which works inside the Experience Builder Embed widget.
  // If you set an appId: when the page is embedded, sign-in opens in a popup
  // (arcgis.com's sign-in page can't load inside an iframe). Popup sign-in needs a
  // callback page next to this file, registered as a redirect URI on the app.
  appId: '',
  popupCallbackUrl: 'oauth-callback.html',
  portalUrl: 'https://www.arcgis.com'
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://js.arcgis.com/4.33/"></script>

<style>
  :root {
    box-sizing: border-box;
    --brand: #0e9bd2;
    --brand-ink: #0a2f5c;
    --ink: #1c2530;
    --muted: #5f6b7a;
    --line: #dde3ea;
    --panel: #f3f5f8;
    --card: #ffffff;
    --on: #0e9bd2;
    --danger: #b3261e;
    --radius: 10px;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr; background: var(--panel); }

  /* ---------- Header ---------- */
  header {
    background: var(--brand);
    color: var(--brand-ink);
    padding: 14px 28px 0;
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
  .header-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .user-box { display: flex; align-items: center; gap: 10px; font-size: .9rem; font-weight: 600; white-space: nowrap; }
  .user-box[hidden] { display: none; }
  .user-box button, .pop-out {
    background: rgba(255,255,255,.2); border: 0; color: var(--brand-ink);
    font: inherit; font-size: .9rem; font-weight: 600; padding: 4px 10px; border-radius: 6px;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .user-box button:hover, .pop-out:hover { background: rgba(255,255,255,.35); }
  .pop-out[hidden] { display: none; }

  .group-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; min-height: 32px; }
  .group-bar select {
    font: inherit; font-size: 1rem; font-weight: 600; color: var(--brand-ink);
    background: rgba(255,255,255,.9); border: 1px solid rgba(10,47,92,.25);
    border-radius: 6px; padding: 4px 8px; max-width: min(420px, 100%);
  }
  .group-bar .group-name { font-size: 1rem; font-weight: 600; }
  .group-bar button {
    font: inherit; font-weight: 600; font-size: .9rem; color: var(--brand-ink);
    background: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .group-bar button:disabled, .group-bar select:disabled { opacity: .6; cursor: progress; }
  .group-status { font-size: .85rem; }

  .tabs { display: flex; margin-top: 14px; }
  .tabs button {
    flex: 1; font: inherit; font-size: 1.05rem; font-weight: 600;
    background: transparent; color: var(--brand-ink); border: 0;
    padding: 12px 8px; border-radius: 10px 10px 0 0; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--panel); }
  .tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 3px solid #ffb400; outline-offset: 2px;
  }

  /* ---------- Main layout ---------- */
  main { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; min-height: 0; }
  .panel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .panel-body { flex: 1; overflow-y: auto; padding: 20px 24px 28px; }
  #viewDiv { min-height: 0; height: 100%; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 55vh; }
    .panel { border-right: 0; border-bottom: 1px solid var(--line); }
    .panel-body { overflow: visible; padding: 16px; }
    .selection-bar { position: sticky; top: 0; z-index: 2; }
    header { padding: 12px 16px 0; }
  }
  [role="tabpanel"][hidden] { display: none; }

  /* ---------- Layers ---------- */
  .layer-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .layer-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px;
  }
  .layer-row .text { flex: 1; min-width: 0; }
  .layer-row .title { font-weight: 600; overflow-wrap: anywhere; }
  .layer-row .sub { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
  .layer-row .source-tag { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  .remove-btn { background: none; border: 0; font-size: 1.2rem; color: var(--muted); cursor: pointer; padding: 2px 6px; }
  .remove-btn:hover { color: var(--danger); }

  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: #b8c1cc; border-radius: 999px; transition: background .15s; }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    background: #fff; border-radius: 50%; transition: transform .15s;
  }
  .switch input:checked + span { background: var(--on); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 3px solid #ffb400; outline-offset: 2px; }

  .list-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .list-tools .count { color: var(--muted); font-size: .9rem; }

  h2 { font-size: 1.05rem; margin: 22px 0 8px; }
  .empty { color: var(--muted); padding: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }

  /* ---------- Forms ---------- */
  label.field { display: block; font-weight: 600; font-size: .92rem; margin: 14px 0 6px; }
  input[type="text"], input[type="url"], select.full, textarea {
    width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  textarea { min-height: 70px; resize: vertical; font-family: Consolas, "Courier New", monospace; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .92rem; }
  .radio-group { display: grid; gap: 6px; }
  .radio-group label { display: flex; gap: 8px; align-items: center; font-size: .92rem; }
  .radio-group label.disabled { color: var(--muted); }

  .btn {
    font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .btn.primary { background: var(--brand-ink); color: #fff; border-color: var(--brand-ink); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.small { padding: 5px 10px; font-size: .85rem; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  .cond-head { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 8px; }
  .cond-head h2 { margin: 0; font-size: .92rem; }
  select.match { font: inherit; font-size: .9rem; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .cond-list { display: grid; gap: 8px; margin: 8px 0 10px; }
  .cond-row {
    display: grid; grid-template-columns: 1.3fr 1fr auto;
    grid-template-areas: "f o x" "v v v"; gap: 6px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px;
  }
  .cond-row .c-field { grid-area: f; }
  .cond-row .c-op { grid-area: o; }
  .cond-row .c-x { grid-area: x; }
  .cond-row .c-val { grid-area: v; }
  .cond-row .c-val:empty { display: none; }
  .cond-row select, .cond-row input {
    width: 100%; min-width: 0; font: inherit; font-size: .92rem; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
  }
  .sql-preview { font-family: Consolas, "Courier New", monospace; font-size: .8rem; color: var(--muted); margin-top: 10px; overflow-wrap: anywhere; }
  details { margin-top: 12px; }
  details summary { cursor: pointer; font-size: .9rem; font-weight: 600; margin-bottom: 8px; }

  /* ---------- Selection basket ---------- */
  .selection-bar { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 24px; }
  .sel-summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sel-summary strong { font-size: .98rem; }
  .sel-summary .actions { margin: 0; }
  .sel-chips { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .sel-chips:empty { display: none; }
  .sel-chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: .85rem; background: var(--panel);
  }
  .sel-chip button.zoom { background: none; border: 0; font: inherit; color: var(--ink); cursor: pointer; padding: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .sel-chip .n { font-weight: 700; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.25); }
  .sel-chip .remove-btn { font-size: 1rem; padding: 0 6px; }
  .layer-sel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 22px; }
  .layer-sel-head h2 { margin: 0; }
  .results li { display: flex; gap: 4px; }
  .results li > button:first-child { flex: 1; }
  .pkg-list { list-style: none; margin: 8px 0 0; padding: 0; font-size: .9rem; display: grid; gap: 4px; }
  .pkg-list li { display: flex; gap: 8px; align-items: center; }

  .status { margin-top: 12px; font-size: .9rem; color: var(--muted); min-height: 1.2em; }
  .status.error { color: var(--danger); }

  .results { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .results button {
    width: 100%; text-align: left; font: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  .results button:hover { border-color: var(--brand); }
  .results .oid { color: var(--muted); font-size: .8rem; }

  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .progress > div { height: 100%; width: 0; background: var(--brand); transition: width .2s; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>
<header>
  <div class="header-top">
    <h1 id="appTitle">Data Exporting</h1>
    <div class="header-actions">
      <a class="pop-out" id="popOut" href="#" target="_blank" rel="noopener" hidden
         title="Open this tool in its own browser tab. Use this if exports don't download here.">Open in new window ↗</a>
      <div class="user-box" id="userBox" hidden>
        <span id="userName"></span>
        <button type="button" id="signOutBtn">Sign out</button>
      </div>
    </div>
  </div>

  <div class="group-bar" id="groupBar">
    <span class="group-name" id="groupName">Signing in…</span>
    <select id="groupSelect" aria-label="Group" hidden></select>
    <button type="button" id="groupSync" hidden title="Re-load this group's layers">⟳ Sync</button>
    <span class="group-status" id="groupStatus" aria-live="polite"></span>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-layers" aria-controls="panel-layers" aria-selected="true">Layers</button>
    <button role="tab" id="tab-query" aria-controls="panel-query" aria-selected="false" tabindex="-1">Query</button>
    <button role="tab" id="tab-export" aria-controls="panel-export" aria-selected="false" tabindex="-1">Export</button>
  </nav>
</header>

<main>
  <section class="panel">
    <!-- SELECTION BASKET (shared by all tabs) -->
    <div class="selection-bar" aria-live="polite">
      <div class="sel-summary">
        <strong id="selSummary">Nothing selected yet</strong>
        <span class="actions">
          <button type="button" class="btn small primary" id="selExport" disabled>Export selection</button>
          <button type="button" class="btn small" id="selClearAll" disabled>Clear all</button>
        </span>
      </div>
      <ul class="sel-chips" id="selChips"></ul>
    </div>

    <div class="panel-body">
    <!-- LAYERS -->
    <div role="tabpanel" id="panel-layers" aria-labelledby="tab-layers">
      <div class="list-tools">
        <span class="count" id="layerCount"></span>
        <span>
          <button type="button" class="btn small" id="allOn">All on</button>
          <button type="button" class="btn small" id="allOff">All off</button>
        </span>
      </div>
      <ul class="layer-list" id="layerList"></ul>

      <div id="addLayerBox">
        <h2>Add a layer by URL</h2>
        <div class="row">
          <input type="url" id="addLayerUrl" placeholder="FeatureServer or MapServer URL" />
          <button type="button" class="btn" id="addLayerBtn">Add</button>
        </div>
        <div class="status" id="addLayerStatus" aria-live="polite"></div>
      </div>
    </div>

    <!-- QUERY -->
    <div role="tabpanel" id="panel-query" aria-labelledby="tab-query" hidden>
      <label class="field" for="queryLayer">Layer</label>
      <select id="queryLayer" class="full"></select>

      <div class="cond-head">
        <h2>Conditions</h2>
        <select id="condMatch" class="match" aria-label="How conditions combine">
          <option value="AND">Match all</option>
          <option value="OR">Match any</option>
        </select>
      </div>
      <div id="condList" class="cond-list"></div>
      <button type="button" class="btn small" id="addCond">+ Add condition</button>
      <div class="sql-preview" id="sqlPreview"></div>

      <details id="sqlDetails">
        <summary>Write the where clause yourself</summary>
        <textarea id="queryWhere" spellcheck="false">1=1</textarea>
        <div class="status">While this is open, the conditions above are ignored.</div>
      </details>

      <label class="check"><input type="checkbox" id="queryExtent" /> Only features in the current map view</label>

      <div class="actions">
        <button type="button" class="btn primary" id="selAdd">Add to selection</button>
        <button type="button" class="btn" id="selRemove">Remove from selection</button>
        <button type="button" class="btn" id="clearQuery">Reset conditions</button>
      </div>
      <div class="status" id="queryStatus" aria-live="polite"></div>

      <div class="layer-sel-head">
        <h2 id="layerSelTitle">Selected in this layer</h2>
        <button type="button" class="btn small" id="selClearLayer" hidden>Clear this layer</button>
      </div>
      <ul class="results" id="queryResults"></ul>
    </div>

    <!-- EXPORT -->
    <div role="tabpanel" id="panel-export" aria-labelledby="tab-export" hidden>
      <label class="field">What to export</label>
      <div class="radio-group">
        <label id="scopePackageLabel"><input type="radio" name="exportScope" value="package" /> <span id="scopePackageText">Everything selected, all layers, as one package</span></label>
        <label id="scopeLayerSelLabel"><input type="radio" name="exportScope" value="layerSel" /> <span>Selected features in one layer</span></label>
        <label><input type="radio" name="exportScope" value="all" checked /> All features in one layer</label>
        <label><input type="radio" name="exportScope" value="extent" /> Features in the current map view, one layer</label>
      </div>

      <div id="exportLayerWrap">
        <label class="field" for="exportLayer">Layer</label>
        <select id="exportLayer" class="full"></select>
      </div>
      <ul class="pkg-list" id="pkgList" hidden></ul>

      <label class="field" for="exportFormat">Format</label>
      <select id="exportFormat" class="full">
        <option value="csv">CSV (attributes; lat/long for points)</option>
        <option value="geojson">GeoJSON (attributes and geometry)</option>
        <option value="kml">KML (Google Earth; attributes and geometry)</option>
      </select>
      <div class="status" id="formatNote"></div>

      <div class="actions">
        <button type="button" class="btn primary" id="runExport">Export</button>
      </div>
      <div class="progress" id="exportProgress" hidden><div></div></div>
      <div class="status" id="exportStatus" aria-live="polite"></div>
    </div>
    </div>
  </section>

  <div id="viewDiv"></div>
</main>

<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/portal/Portal",
  "esri/portal/PortalQueryParams",
  "esri/identity/OAuthInfo",
  "esri/identity/IdentityManager",
  "esri/layers/Layer",
  "esri/layers/GraphicsLayer",
  "esri/Graphic"
], (EsriMap, MapView, Portal, PortalQueryParams, OAuthInfo, esriId, Layer, GraphicsLayer, Graphic) => {

  const cfg = window.EXPORTER_CONFIG;
  const $ = (s) => document.querySelector(s);
  const STORAGE_KEY = "exporter.groupId";

  // True when this page runs inside an iframe (e.g. the Experience Builder Embed widget).
  const isEmbedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  /* ---------------- State ---------------- */
  const state = {
    portal: null,
    groups: [],
    currentGroupId: null,
    loadToken: 0,
    topLayers: [],
    entries: new Map()
  };

  const selection = new Map();
  const PALETTE = ["#ffb400", "#e8467c", "#00a884", "#7c4dff", "#ff6b00", "#2f80ed", "#c2185b", "#6d8b00"];
  let paletteIdx = 0;
  let entrySeq = 0;

  /* ---------------- Map ---------------- */
  const map = new EsriMap({ basemap: cfg.basemap || "hybrid" });
  const selectionLayer = new GraphicsLayer({ title: "Selection", listMode: "hide" });
  map.add(selectionLayer);
  const view = new MapView({ container: "viewDiv", map, center: cfg.center, zoom: cfg.zoom });

  document.title = cfg.title;
  $("#appTitle").textContent = cfg.title;
  $("#addLayerBox").hidden = !cfg.allowAddingLayers;

  /* ---------------- Pop-out link (embedded only) ---------------- */
  function updatePopOutLink() {
    if (!isEmbedded) return;
    $("#popOut").href = location.href;   // keeps ?group=… so the same group opens
  }
  if (isEmbedded) {
    $("#popOut").hidden = false;
    updatePopOutLink();
  }

  /* ---------------- Tabs ---------------- */
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => selectTab(tab));
    tab.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
      selectTab(next); next.focus();
    });
  });
  function selectTab(tab) {
    tabs.forEach((t) => {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
    });
    if (tab.id === "tab-export") refreshExportScope();
  }

  /* ---------------- Sign-in ---------------- */
  async function signIn() {
    const sharingUrl = cfg.portalUrl.replace(/\/$/, "") + "/sharing";
    if (cfg.appId) {
      // arcgis.com's sign-in page refuses to load inside an iframe, so use a popup when embedded.
      const info = new OAuthInfo({ appId: cfg.appId, portalUrl: cfg.portalUrl, popup: isEmbedded });
      if (isEmbedded && cfg.popupCallbackUrl) info.popupCallbackUrl = cfg.popupCallbackUrl;
      esriId.registerOAuthInfos([info]);
    }
    await esriId.checkSignInStatus(sharingUrl).catch(() => {});
    const portal = new Portal({ url: cfg.portalUrl, authMode: "immediate" });
    await portal.load();
    return portal;
  }

  $("#signOutBtn").addEventListener("click", () => {
    esriId.destroyCredentials();
    location.reload();
  });

  /* ---------------- Group portal ---------------- */
  async function initGroupPortal(portal) {
    const select = $("#groupSelect");
    const nameEl = $("#groupName");

    let groups = portal.user ? await portal.user.fetchGroups() : [];

    if (cfg.groupId && !groups.some((g) => g.id === cfg.groupId)) {
      try {
        const r = await portal.queryGroups(new PortalQueryParams({ query: `id:${cfg.groupId}` }));
        if (r.results[0]) groups.push(r.results[0]);
      } catch (e) { /* not accessible */ }
    }

    groups.sort((a, b) => a.title.localeCompare(b.title));
    state.groups = groups;

    if (!groups.length) {
      nameEl.textContent = "No groups available";
      setGroupStatus("Join a group in ArcGIS, or add layers by URL below.");
      return;
    }

    select.innerHTML = groups.map((g) => `<option value="${g.id}">${escapeHtml(g.title)}</option>`).join("");

    const urlId = new URLSearchParams(location.search).get("group");
    // Storage can be blocked or partitioned inside an iframe; the try/catch keeps that harmless.
    let saved = null;
    try { saved = cfg.rememberGroup ? localStorage.getItem(STORAGE_KEY) : null; } catch (e) {}
    const has = (id) => id && groups.some((g) => g.id === id);
    const startId = [urlId, saved, cfg.groupId].find(has) || groups[0].id;

    const canSwitch = cfg.allowGroupSwitching && groups.length > 1;
    select.hidden = !canSwitch;
    nameEl.hidden = canSwitch;
    select.value = startId;
    $("#groupSync").hidden = false;

    select.addEventListener("change", () => switchGroup(select.value));
    $("#groupSync").addEventListener("click", () => switchGroup(state.currentGroupId || select.value, true));

    await switchGroup(startId);
  }

  async function switchGroup(groupId, isResync = false) {
    const group = state.groups.find((g) => g.id === groupId);
    if (!group) return;

    const token = ++state.loadToken;
    const select = $("#groupSelect");
    const syncBtn = $("#groupSync");
    select.disabled = syncBtn.disabled = true;
    $("#groupName").textContent = group.title;
    setGroupStatus(isResync ? "Syncing…" : "Loading layers…");

    try {
      clearSource("group");

      const typeClause = cfg.groupItemTypes.map((t) => `type:"${t}"`).join(" OR ");
      const items = [];
      let params = new PortalQueryParams({ query: `(${typeClause})`, num: 100, sortField: "title" });
      while (params) {
        const res = await group.queryItems(params);
        if (token !== state.loadToken) return;
        items.push(...res.results);
        params = res.nextQueryParams && res.nextQueryParams.start > 0 ? res.nextQueryParams : null;
      }

      let failed = 0;
      for (const item of items) {
        try {
          const layer = await Layer.fromPortalItem({ portalItem: item });
          if (token !== state.loadToken) { layer.destroy?.(); return; }
          await addTopLayer(layer, "group", item);
        } catch (e) {
          console.warn("Could not load item", item.title, e);
          failed++;
        }
        if (token !== state.loadToken) return;
      }

      state.currentGroupId = groupId;
      try { if (cfg.rememberGroup) localStorage.setItem(STORAGE_KEY, groupId); } catch (e) {}
      const url = new URL(location.href);
      url.searchParams.set("group", groupId);
      history.replaceState(null, "", url);
      updatePopOutLink();

      const n = items.length - failed;
      let msg = `${n} item${n === 1 ? "" : "s"} loaded · synced ${new Date().toLocaleTimeString()}`;
      if (failed) msg += ` · ${failed} couldn't be opened`;
      if (!items.length) msg = "This group has no feature or map services.";
      setGroupStatus(msg);
    } catch (err) {
      console.error(err);
      if (token === state.loadToken) setGroupStatus("Couldn't load this group. Check your access and try Sync.");
    } finally {
      if (token === state.loadToken) {
        select.disabled = syncBtn.disabled = false;
        renderAll();
      }
    }
  }

  function setGroupStatus(text) { $("#groupStatus").textContent = text; }

  /* ---------------- Layer registry ---------------- */
  async function addTopLayer(layer, source, item) {
    await layer.load();
    const key = `k${++entrySeq}`;
    const itemTitle = item?.title || layer.title;
    const itemName = item?.name && item.name !== itemTitle ? item.name : "";
    const on = !!cfg.startLayersOn;

    if (layer.type === "group") {
      layer.visible = true;
      const children = layer.layers.toArray();
      await Promise.all(children.map((c) => c.load().catch(() => {})));
      children.forEach((child) => {
        child.visible = on;
        const title = children.length > 1 || child.title !== itemTitle ? `${itemTitle} - ${child.title}` : itemTitle;
        registerEntry({
          title, sub: itemName, source, key, visTarget: child,
          queryable: child.type === "feature",
          getQueryLayer: async () => child
        });
      });
    } else if (layer.type === "map-image") {
      layer.visible = true;
      const leaves = layer.allSublayers.toArray().filter((s) => !s.sublayers || s.sublayers.length === 0);
      leaves.forEach((sub) => {
        sub.visible = on;
        registerEntry({
          title: leaves.length > 1 ? `${itemTitle} - ${sub.title}` : itemTitle,
          sub: itemName, source, key, visTarget: sub,
          queryable: true,
          getQueryLayer: cached(async () => { const fl = await sub.createFeatureLayer(); await fl.load(); return fl; })
        });
      });
    } else {
      layer.visible = on;
      registerEntry({
        title: layer.title || itemTitle,
        sub: itemName, source, key, visTarget: layer,
        queryable: layer.type === "feature",
        getQueryLayer: async () => layer
      });
    }

    map.add(layer);
    map.reorder(selectionLayer, map.layers.length - 1);
    state.topLayers.push({ layer, source, key });
  }

  function registerEntry(e) {
    const id = `e${++entrySeq}`;
    state.entries.set(id, { id, ...e });
  }

  function clearSource(source) {
    state.topLayers.filter((t) => t.source === source).forEach((t) => map.remove(t.layer));
    state.topLayers = state.topLayers.filter((t) => t.source !== source);
    for (const [id, e] of state.entries) if (e.source === source) state.entries.delete(id);
  }

  function removeByKey(key) {
    const t = state.topLayers.find((x) => x.key === key);
    if (t) map.remove(t.layer);
    state.topLayers = state.topLayers.filter((x) => x.key !== key);
    for (const [id, e] of state.entries) if (e.key === key) state.entries.delete(id);
    renderAll();
  }

  function cached(fn) { let p; return () => (p ||= fn().catch((e) => { p = null; throw e; })); }

  /* ---------------- Rendering ---------------- */
  function renderAll() { renderLayerList(); renderLayerSelects(); renderSelection(); }

  function renderLayerList() {
    const list = $("#layerList");
    const entries = [...state.entries.values()];
    $("#layerCount").textContent = entries.length ? `${entries.length} layer${entries.length === 1 ? "" : "s"}` : "";
    if (!entries.length) {
      list.innerHTML = `<li class="empty">No layers yet. Pick a group above${cfg.allowAddingLayers ? " or add one by URL below" : ""}.</li>`;
      return;
    }
    list.innerHTML = entries.map((e) => `
      <li class="layer-row" data-entry-id="${e.id}">
        <label class="switch" title="Show or hide">
          <input type="checkbox" role="switch" ${e.visTarget.visible ? "checked" : ""} aria-label="Show ${escapeHtml(e.title)}" />
          <span></span>
        </label>
        <div class="text">
          <div class="title">${escapeHtml(e.title)}</div>
          ${e.sub ? `<div class="sub">${escapeHtml(e.sub)}</div>` : ""}
        </div>
        ${e.source === "url" ? `<span class="source-tag">URL</span><button class="remove-btn" type="button" data-remove="${e.key}" aria-label="Remove ${escapeHtml(e.title)}">×</button>` : ""}
      </li>`).join("");
  }

  $("#layerList").addEventListener("change", (ev) => {
    const row = ev.target.closest("[data-entry-id]");
    const e = row && state.entries.get(row.dataset.entryId);
    if (e) e.visTarget.visible = ev.target.checked;
  });
  $("#layerList").addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-remove]");
    if (btn) removeByKey(btn.dataset.remove);
  });
  $("#allOn").addEventListener("click", () => setAll(true));
  $("#allOff").addEventListener("click", () => setAll(false));
  function setAll(v) { state.entries.forEach((e) => (e.visTarget.visible = v)); renderLayerList(); }

  function renderLayerSelects() {
    const queryable = [...state.entries.values()].filter((e) => e.queryable);
    const sel = $("#queryLayer");
    const prev = sel.value;
    const prevTitle = sel.selectedOptions[0]?.textContent;
    sel.innerHTML = queryable.length
      ? queryable.map((e) => `<option value="${e.id}">${escapeHtml(e.title)}</option>`).join("")
      : `<option value="">No queryable layers</option>`;
    const keep = queryable.find((e) => e.id === prev) || queryable.find((e) => e.title === prevTitle);
    if (keep) sel.value = keep.id;
    sel.disabled = !queryable.length;
    $("#selAdd").disabled = $("#selRemove").disabled = !queryable.length;
    loadConditionLayer();
  }

  /* ---------------- Add by URL ---------------- */
  $("#addLayerBtn").addEventListener("click", addFromUrl);
  $("#addLayerUrl").addEventListener("keydown", (e) => { if (e.key === "Enter") addFromUrl(); });

  async function addFromUrl() {
    const input = $("#addLayerUrl");
    const url = input.value.trim();
    const status = $("#addLayerStatus");
    if (!/^https?:\/\/.+\/(FeatureServer|MapServer)(\/\d+)?\/?$/i.test(url)) {
      setStatus(status, "Enter a FeatureServer or MapServer URL, e.g. …/FeatureServer/0", true);
      return;
    }
    setStatus(status, "Adding…");
    try {
      const layer = await Layer.fromArcGISServerUrl({ url });
      await addTopLayer(layer, "url", null);
      input.value = "";
      setStatus(status, `Added ${layer.title}.`);
      renderAll();
    } catch (e) {
      console.error(e);
      setStatus(status, "Couldn't add that layer. Check the URL and that you have access.", true);
    }
  }

  /* ---------------- Query ---------------- */
  $("#queryLayer").addEventListener("change", () => loadConditionLayer(true));
  $("#selAdd").addEventListener("click", () => applySelection("add"));
  $("#selRemove").addEventListener("click", () => applySelection("remove"));
  $("#clearQuery").addEventListener("click", () => { setStatus($("#queryStatus"), ""); loadConditionLayer(true); });

  /* ---------------- Conditions builder ---------------- */
  const cond = { entryId: null, fl: null, fields: [], distinct: new Map() };
  let condSeq = 0;

  const OPS = {
    string: [["eq", "equals"], ["ne", "does not equal"], ["contains", "contains"], ["starts", "starts with"], ["blank", "is blank"], ["notblank", "is not blank"]],
    number: [["eq", "="], ["ne", "≠"], ["gt", ">"], ["gte", "≥"], ["lt", "<"], ["lte", "≤"], ["blank", "is blank"], ["notblank", "is not blank"]],
    date:   [["on", "is on"], ["before", "is before"], ["after", "is after"], ["blank", "is blank"], ["notblank", "is not blank"]],
    coded:  [["eq", "is"], ["ne", "is not"], ["blank", "is blank"], ["notblank", "is not blank"]]
  };
  const NUMERIC = ["small-integer", "integer", "big-integer", "long", "single", "double", "oid"];
  const DATES = ["date", "date-only", "timestamp-offset"];

  function kindOf(f) {
    if (f.domain && f.domain.type === "coded-value") return "coded";
    if (NUMERIC.includes(f.type)) return "number";
    if (DATES.includes(f.type)) return "date";
    return "string";
  }

  async function loadConditionLayer(force = false) {
    const e = state.entries.get($("#queryLayer").value);
    if (!force && e && e.id === cond.entryId && cond.fl) return;   // same layer: keep the user's conditions
    $("#condList").innerHTML = "";
    cond.entryId = e ? e.id : null;
    cond.fl = null; cond.fields = []; cond.distinct.clear();
    if (!e) { updateSqlPreview(); return; }
    try {
      const fl = await e.getQueryLayer();
      if (cond.entryId !== e.id) return;
      cond.fl = fl;
      e.selKey = selKey(fl);
      cond.fields = (fl.fields || []).filter((f) => !["geometry", "blob", "raster", "xml"].includes(f.type));
    } catch (err) { console.warn(err); }
    addConditionRow();
    renderLayerSelection();
  }

  function addConditionRow() {
    if (!cond.fields.length) { updateSqlPreview(); return; }
    const row = document.createElement("div");
    row.className = "cond-row";
    row.dataset.cid = ++condSeq;
    row.innerHTML = `
      <select class="c-field" aria-label="Field">
        ${cond.fields.map((f) => `<option value="${escapeHtml(f.name)}">${escapeHtml(f.alias || f.name)}</option>`).join("")}
      </select>
      <select class="c-op" aria-label="Condition"></select>
      <div class="c-val"></div>
      <button type="button" class="remove-btn c-x" aria-label="Remove condition">×</button>`;
    $("#condList").appendChild(row);
    const def = cond.fields.find((f) => !["oid", "global-id", "guid"].includes(f.type)) || cond.fields[0];
    row.querySelector(".c-field").value = def.name;
    onFieldChange(row);
  }

  function fieldOf(row) { return cond.fields.find((f) => f.name === row.querySelector(".c-field").value); }

  function onFieldChange(row) {
    const f = fieldOf(row);
    row.querySelector(".c-op").innerHTML = OPS[kindOf(f)].map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
    onOpChange(row);
  }

  function onOpChange(row) {
    const f = fieldOf(row);
    const kind = kindOf(f);
    const op = row.querySelector(".c-op").value;
    const wrap = row.querySelector(".c-val");
    const prev = wrap.querySelector("input, select")?.value || "";
    wrap.innerHTML = "";

    if (op !== "blank" && op !== "notblank") {
      if (kind === "coded") {
        wrap.innerHTML = `<select aria-label="Value">${f.domain.codedValues
          .map((c) => `<option value="${escapeHtml(String(c.code))}">${escapeHtml(c.name)}</option>`).join("")}</select>`;
      } else if (kind === "date") {
        wrap.innerHTML = `<input type="date" aria-label="Date" />`;
      } else if (kind === "number") {
        wrap.innerHTML = `<input type="number" step="any" aria-label="Value" placeholder="Number" />`;
      } else {
        const listId = `dl-${row.dataset.cid}`;
        wrap.innerHTML = `<input type="text" list="${listId}" aria-label="Value" placeholder="Type or pick a value" autocomplete="off" /><datalist id="${listId}"></datalist>`;
        getDistinct(f.name).then((vals) => {
          const dl = document.getElementById(listId);
          if (dl) dl.innerHTML = vals.map((v) => `<option value="${escapeHtml(String(v))}"></option>`).join("");
        });
      }
      const input = wrap.querySelector("input, select");
      if (prev && input.tagName === "INPUT" && input.type !== "date") input.value = prev;
    }
    updateSqlPreview();
  }

  function getDistinct(name) {
    if (cond.distinct.has(name)) return cond.distinct.get(name);
    const fl = cond.fl;
    const p = (async () => {
      const q = fl.createQuery();
      q.where = "1=1";
      q.outFields = [name];
      q.returnDistinctValues = true;
      q.returnGeometry = false;
      q.orderByFields = [name];
      const r = await fl.queryFeatures(q);
      return r.features.map((ft) => ft.attributes[name]).filter((v) => v != null && v !== "");
    })().catch(() => []);
    cond.distinct.set(name, p);
    return p;
  }

  $("#condList").addEventListener("change", (ev) => {
    const row = ev.target.closest(".cond-row");
    if (!row) return;
    if (ev.target.classList.contains("c-field")) onFieldChange(row);
    else if (ev.target.classList.contains("c-op")) onOpChange(row);
    else updateSqlPreview();
  });
  $("#condList").addEventListener("input", updateSqlPreview);
  $("#condList").addEventListener("click", (ev) => {
    if (!ev.target.closest(".c-x")) return;
    ev.target.closest(".cond-row").remove();
    updateSqlPreview();
  });
  $("#addCond").addEventListener("click", addConditionRow);
  $("#condMatch").addEventListener("change", updateSqlPreview);
  $("#sqlDetails").addEventListener("toggle", () => {
    if ($("#sqlDetails").open) $("#queryWhere").value = buildConditionsWhere();
    updateSqlPreview();
  });

  function buildWhere() {
    if ($("#sqlDetails").open) return $("#queryWhere").value.trim() || "1=1";
    return buildConditionsWhere();
  }

  function buildConditionsWhere() {
    const parts = [];
    for (const row of $("#condList").children) {
      const f = fieldOf(row);
      if (!f) continue;
      const input = row.querySelector(".c-val input, .c-val select");
      const clause = clauseFor(f, row.querySelector(".c-op").value, input ? input.value.trim() : "");
      if (clause) parts.push(clause);
    }
    if (!parts.length) return "1=1";
    if (parts.length === 1) return parts[0];
    return parts.map((p) => `(${p})`).join(` ${$("#condMatch").value} `);
  }

  function clauseFor(f, op, raw) {
    const n = f.name;
    const kind = kindOf(f);
    const str = (v) => `'${String(v).replace(/'/g, "''")}'`;

    if (op === "blank") return kind === "string" ? `${n} IS NULL OR ${n} = ''` : `${n} IS NULL`;
    if (op === "notblank") return kind === "string" ? `${n} IS NOT NULL AND ${n} <> ''` : `${n} IS NOT NULL`;
    if (raw === "") return null;

    if (kind === "coded") {
      const numericCode = typeof f.domain.codedValues[0]?.code === "number";
      return `${n} ${op === "eq" ? "=" : "<>"} ${numericCode ? Number(raw) : str(raw)}`;
    }
    if (kind === "number") {
      const v = Number(raw);
      if (!Number.isFinite(v)) return null;
      return `${n} ${{ eq: "=", ne: "<>", gt: ">", gte: ">=", lt: "<", lte: "<=" }[op]} ${v}`;
    }
    if (kind === "date") {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return null;
      const d = new Date(raw + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1);
      const next = d.toISOString().slice(0, 10);
      if (op === "on") return `${n} >= DATE '${raw}' AND ${n} < DATE '${next}'`;
      if (op === "before") return `${n} < DATE '${raw}'`;
      if (op === "after") return `${n} >= DATE '${next}'`;
      return null;
    }
    const up = raw.toUpperCase().replace(/'/g, "''");
    if (op === "eq") return `${n} = ${str(raw)}`;
    if (op === "ne") return `${n} <> ${str(raw)}`;
    if (op === "contains") return `UPPER(${n}) LIKE '%${up}%'`;
    if (op === "starts") return `UPPER(${n}) LIKE '${up}%'`;
    return null;
  }

  function updateSqlPreview() {
    const el = $("#sqlPreview");
    el.hidden = $("#sqlDetails").open;
    el.textContent = `Where: ${buildConditionsWhere()}`;
  }

  /* ---------------- Selection basket ---------------- */
  function selKey(fl) { return `${fl.url}|${fl.layerId}`; }
  function labelFieldOf(fl) { return fl.displayField && fl.displayField !== fl.objectIdField ? fl.displayField : null; }
  function currentSelItem() {
    const e = state.entries.get($("#queryLayer").value);
    return e && e.selKey ? selection.get(e.selKey) : null;
  }

  async function applySelection(mode) {
    const e = state.entries.get($("#queryLayer").value);
    if (!e) return;
    const status = $("#queryStatus");
    const where = buildWhere();
    const geometry = $("#queryExtent").checked ? view.extent.clone() : null;
    const buttons = [$("#selAdd"), $("#selRemove")];
    buttons.forEach((b) => (b.disabled = true));
    setStatus(status, "Finding matching features…");

    try {
      const fl = await e.getQueryLayer();
      e.selKey = selKey(fl);
      const q = fl.createQuery();
      q.where = where;
      if (geometry) { q.geometry = geometry; q.spatialRelationship = "intersects"; }
      const ids = (await fl.queryObjectIds(q)) || [];
      let item = selection.get(e.selKey);

      if (mode === "add") {
        if (!item) {
          item = { key: e.selKey, title: e.title, fl, color: PALETTE[paletteIdx++ % PALETTE.length], oids: new Set(), graphics: new Map() };
          selection.set(item.key, item);
        }
        const fresh = ids.filter((id) => !item.oids.has(id));
        const room = Math.max(0, cfg.maxFeaturesPerLayer - item.oids.size);
        const toAdd = fresh.slice(0, room);
        await addToSelection(item, toAdd, (n) => setStatus(status, `Adding ${n.toLocaleString()} of ${toAdd.length.toLocaleString()}…`));
        if (!item.oids.size) selection.delete(item.key);

        let msg = `${ids.length.toLocaleString()} matched, ${toAdd.length.toLocaleString()} added`;
        if (fresh.length < ids.length) msg += ` (${(ids.length - fresh.length).toLocaleString()} were already selected)`;
        msg += `. ${item.oids.size.toLocaleString()} now selected in this layer.`;
        if (toAdd.length < fresh.length) msg += ` ${(fresh.length - toAdd.length).toLocaleString()} weren't added: the limit is ${cfg.maxFeaturesPerLayer.toLocaleString()} per layer.`;
        setStatus(status, msg);
        if (toAdd.length) zoomToGraphics(toAdd.map((id) => item.graphics.get(id)));
      } else {
        if (!item) { setStatus(status, "Nothing is selected in this layer yet."); return; }
        const removed = removeFromSelection(item, ids);
        setStatus(status, `${removed.toLocaleString()} removed. ${item.oids.size.toLocaleString()} still selected in this layer.`);
      }
    } catch (err) {
      console.error(err);
      setStatus(status, `Selection failed: ${err.details?.messages?.[0] || err.message}. Check the conditions.`, true);
    } finally {
      buttons.forEach((b) => (b.disabled = false));
      renderSelection();
    }
  }

  async function addToSelection(item, ids, onProgress) {
    const fl = item.fl;
    const oidField = fl.objectIdField;
    const label = labelFieldOf(fl);
    const chunk = Math.min(fl.capabilities?.query?.maxRecordCount || 1000, 1000);
    let done = 0;
    for (let i = 0; i < ids.length; i += chunk) {
      const q = fl.createQuery();
      q.where = "1=1";
      q.objectIds = ids.slice(i, i + chunk);
      q.outFields = label ? [oidField, label] : [oidField];
      q.returnGeometry = true;
      q.outSpatialReference = view.spatialReference;
      const res = await fl.queryFeatures(q);
      res.features.forEach((f) => {
        const oid = f.attributes[oidField];
        f.symbol = symbolFor(f.geometry, item.color);
        item.graphics.set(oid, f);
        item.oids.add(oid);
      });
      selectionLayer.addMany(res.features);
      done += q.objectIds.length;
      onProgress?.(done);
    }
  }

  function removeFromSelection(item, ids) {
    let removed = 0;
    const gone = [];
    for (const id of ids) {
      if (!item.oids.delete(id)) continue;
      removed++;
      const g = item.graphics.get(id);
      if (g) gone.push(g);
      item.graphics.delete(id);
    }
    selectionLayer.removeMany(gone);
    if (!item.oids.size) selection.delete(item.key);
    return removed;
  }

  function clearSelectionItem(key) {
    const item = selection.get(key);
    if (item) removeFromSelection(item, [...item.oids]);
  }

  function zoomToGraphics(graphics) {
    const geoms = graphics.filter(Boolean).map((g) => g.geometry).filter(Boolean);
    if (!geoms.length) return;
    if (geoms.length === 1 && geoms[0].type === "point") view.goTo({ target: geoms[0], zoom: Math.max(view.zoom, 17) }).catch(() => {});
    else view.goTo(geoms).catch(() => {});
  }

  function renderSelection() {
    const items = [...selection.values()];
    const total = items.reduce((n, it) => n + it.oids.size, 0);
    $("#selSummary").textContent = total
      ? `${total.toLocaleString()} feature${total === 1 ? "" : "s"} selected in ${items.length} layer${items.length === 1 ? "" : "s"}`
      : "Nothing selected yet";
    $("#selExport").disabled = $("#selClearAll").disabled = !total;
    $("#selChips").innerHTML = items.map((it) => `
      <li class="sel-chip">
        <span class="swatch" style="background:${it.color}"></span>
        <button type="button" class="zoom" data-zoom="${escapeHtml(it.key)}" title="Zoom to ${escapeHtml(it.title)}">${escapeHtml(it.title)} <span class="n">${it.oids.size.toLocaleString()}</span></button>
        <button type="button" class="remove-btn" data-clear="${escapeHtml(it.key)}" aria-label="Clear selection in ${escapeHtml(it.title)}">×</button>
      </li>`).join("");
    renderLayerSelection();
    refreshExportScope();
  }

  function renderLayerSelection() {
    const item = currentSelItem();
    const list = $("#queryResults");
    const n = item ? item.oids.size : 0;
    $("#layerSelTitle").textContent = `Selected in this layer (${n.toLocaleString()})`;
    $("#selClearLayer").hidden = !n;
    if (!n) { list.innerHTML = `<li class="empty">Nothing selected in this layer yet. Set conditions above and press Add to selection.</li>`; return; }

    const oidField = item.fl.objectIdField;
    const label = labelFieldOf(item.fl);
    const shown = [...item.graphics.values()].slice(0, cfg.maxResultsListed);
    list.innerHTML = shown.map((g) => {
      const a = g.attributes;
      const text = label && a[label] != null && a[label] !== "" ? a[label] : `Feature ${a[oidField]}`;
      return `<li>
        <button type="button" data-oid="${a[oidField]}">${escapeHtml(String(text))} <span class="oid">OBJECTID ${a[oidField]}</span></button>
        <button type="button" class="remove-btn" data-unselect="${a[oidField]}" aria-label="Remove from selection">×</button>
      </li>`;
    }).join("") + (n > shown.length ? `<li class="status">Showing ${shown.length} of ${n.toLocaleString()}.</li>` : "");
  }

  $("#queryResults").addEventListener("click", (ev) => {
    const item = currentSelItem();
    if (!item) return;
    const un = ev.target.closest("[data-unselect]");
    if (un) { removeFromSelection(item, [Number(un.dataset.unselect)]); renderSelection(); return; }
    const b = ev.target.closest("[data-oid]");
    if (b) zoomToGraphics([item.graphics.get(Number(b.dataset.oid))]);
  });
  $("#selChips").addEventListener("click", (ev) => {
    const c = ev.target.closest("[data-clear]");
    if (c) { clearSelectionItem(c.dataset.clear); renderSelection(); return; }
    const z = ev.target.closest("[data-zoom]");
    if (z) {
      const item = selection.get(z.dataset.zoom);
      if (item) zoomToGraphics([...item.graphics.values()]);
    }
  });
  $("#selClearLayer").addEventListener("click", () => {
    const item = currentSelItem();
    if (item) { clearSelectionItem(item.key); renderSelection(); }
  });
  $("#selClearAll").addEventListener("click", () => {
    const total = [...selection.values()].reduce((n, it) => n + it.oids.size, 0);
    if (!confirm(`Clear all ${total.toLocaleString()} selected features?`)) return;
    [...selection.keys()].forEach(clearSelectionItem);
    renderSelection();
  });
  $("#selExport").addEventListener("click", () => {
    document.querySelector('input[name="exportScope"][value="package"]').checked = true;
    selectTab($("#tab-export"));
  });

  function symbolFor(g, color = "#ffb400") {
    if (!g) return null;
    if (g.type === "point" || g.type === "multipoint")
      return { type: "simple-marker", color, size: 9, outline: { color: [10, 47, 92], width: 1.2 } };
    if (g.type === "polyline") return { type: "simple-line", color, width: 3 };
    const fill = hexToRgb(color);
    return { type: "simple-fill", color: [...fill, 0.25], outline: { color, width: 2 } };
  }
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

  /* ---------------- Export ---------------- */
  document.querySelectorAll('input[name="exportScope"]').forEach((r) => r.addEventListener("change", refreshExportScope));
  $("#exportFormat").addEventListener("change", refreshExportScope);
  $("#runExport").addEventListener("click", runExport);

  // Appended to export messages when embedded, in case the host iframe blocks downloads.
  const EMBED_HINT = " If no file downloaded, allow pop-ups for this site, or use “Open in new window” at the top right and export from there.";
  let dlWin = null;   // helper window for the export in progress (embedded only)

  function refreshExportScope() {
    const items = [...selection.values()];
    const total = items.reduce((n, it) => n + it.oids.size, 0);
    const hasSel = total > 0;

    for (const [val, id] of [["package", "#scopePackageLabel"], ["layerSel", "#scopeLayerSelLabel"]]) {
      const r = document.querySelector(`input[name="exportScope"][value="${val}"]`);
      r.disabled = !hasSel;
      $(id).classList.toggle("disabled", !hasSel);
      if (!hasSel && r.checked) document.querySelector('input[name="exportScope"][value="all"]').checked = true;
    }
    $("#scopePackageText").textContent = hasSel
      ? `Everything selected, ${total.toLocaleString()} features from ${items.length} layer${items.length === 1 ? "" : "s"}, as one package`
      : "Everything selected, all layers, as one package (select features on the Query tab first)";

    const scope = document.querySelector('input[name="exportScope"]:checked').value;
    const format = $("#exportFormat").value;
    $("#exportLayerWrap").hidden = scope === "package";
    $("#pkgList").hidden = scope !== "package";
    $("#pkgList").innerHTML = items.map((it) =>
      `<li><span class="swatch" style="background:${it.color}"></span>${escapeHtml(it.title)}: ${it.oids.size.toLocaleString()}</li>`).join("");

    let note = "";
    if (scope === "package") {
      note = format === "kml"
        ? "Downloads one .kmz file with a folder per layer. Opens directly in Google Earth."
        : `Downloads one .zip with a ${format === "csv" ? "CSV" : "GeoJSON"} file per layer.`;
    }
    if (format === "csv") note += (note ? " " : "") + "CSV includes lat/long for point layers only.";
    $("#formatNote").textContent = note;

    // Layer dropdown: selected layers for "layerSel", all queryable layers otherwise
    const sel = $("#exportLayer");
    const prev = sel.value;
    const opts = scope === "layerSel"
      ? items.map((it) => [`s:${it.key}`, `${it.title} (${it.oids.size.toLocaleString()} selected)`])
      : [...state.entries.values()].filter((e) => e.queryable).map((e) => [`e:${e.id}`, e.title]);
    sel.innerHTML = opts.length
      ? opts.map(([v, t]) => `<option value="${escapeHtml(v)}">${escapeHtml(t)}</option>`).join("")
      : `<option value="">No layers available</option>`;
    if (opts.some(([v]) => v === prev)) sel.value = prev;
    sel.disabled = !opts.length;
    $("#runExport").disabled = scope === "package" ? !hasSel : !opts.length;
  }

  async function runExport() {
    const status = $("#exportStatus");
    const bar = $("#exportProgress");
    const scope = document.querySelector('input[name="exportScope"]:checked').value;
    const format = $("#exportFormat").value;
    const date = new Date().toISOString().slice(0, 10);

    $("#runExport").disabled = true;
    bar.hidden = false; setProgress(0);
    dlWin = openDownloadWindow();   // must happen before any await
    try {
      if (scope === "package") { await exportPackage(format, date); return; }

      let fl, title, ids, total;
      const v = $("#exportLayer").value;
      if (scope === "layerSel") {
        const item = selection.get(v.slice(2));
        if (!item) return;
        ({ fl, title } = item);
        ids = [...item.oids].sort((a, b) => a - b);
        total = ids.length;
      } else {
        const e = state.entries.get(v.slice(2));
        if (!e) return;
        fl = await e.getQueryLayer();
        title = e.title;
        setStatus(status, "Finding features…");
        const q = fl.createQuery();
        q.where = "1=1";
        if (scope === "extent") { q.geometry = view.extent.clone(); q.spatialRelationship = "intersects"; }
        ids = ((await fl.queryObjectIds(q)) || []).sort((a, b) => a - b);
        total = ids.length;
        ids = ids.slice(0, cfg.maxFeaturesPerLayer);
      }
      if (!ids.length) { setStatus(status, "No features to export."); return; }

      const features = await fetchForExport(fl, ids, format, (n) => {
        setProgress(n / ids.length);
        setStatus(status, `Downloading ${n.toLocaleString()} of ${ids.length.toLocaleString()}…`);
      });
      const out = serialize(format, features, fl, title);
      const viaHelper = downloadBlob(new Blob([out.text], { type: out.mime }), `${slug(title)}_${date}.${out.ext}`, dlWin);

      let msg = `Exported ${features.length.toLocaleString()} feature${features.length === 1 ? "" : "s"}.`;
      if (total > ids.length) msg += ` ${(total - ids.length).toLocaleString()} more were left out by the ${cfg.maxFeaturesPerLayer.toLocaleString()}-feature limit.`;
      if (isEmbedded && !viaHelper) msg += EMBED_HINT;
      setStatus(status, msg);
    } catch (err) {
      console.error(err);
      setStatus(status, `Export failed: ${err.details?.messages?.[0] || err.message}`, true);
    } finally {
      closeDownloadWindow(dlWin);
      dlWin = null;
      refreshExportScope();
      setTimeout(() => (bar.hidden = true), 800);
    }
  }

  async function exportPackage(format, date) {
    const status = $("#exportStatus");
    const items = [...selection.values()];
    const grand = items.reduce((n, it) => n + it.oids.size, 0);
    const zip = new JSZip();
    const usedNames = new Set();
    const manifest = [`Selection export, ${new Date().toLocaleString()}`, ""];
    const kmlFolders = [];
    let done = 0, written = 0;

    for (const item of items) {
      const ids = [...item.oids].sort((a, b) => a - b);
      const features = await fetchForExport(item.fl, ids, format, (n) => {
        setProgress((done + n) / grand);
        setStatus(status, `Downloading ${item.title}: ${n.toLocaleString()} of ${ids.length.toLocaleString()}…`);
      });
      done += ids.length;
      written += features.length;

      let fileLabel;
      if (format === "kml") {
        kmlFolders.push(kmlFolder(features, exportFields(item.fl), item.fl, item.title, item.color));
        fileLabel = `folder "${item.title}"`;
      } else {
        const out = serialize(format, features, item.fl, item.title);
        let name = `${slug(item.title)}.${out.ext}`, i = 2;
        while (usedNames.has(name)) name = `${slug(item.title)}_${i++}.${out.ext}`;
        usedNames.add(name);
        zip.file(name, out.text);
        fileLabel = name;
      }
      manifest.push(`${fileLabel}: ${features.length} features from ${item.title}`, `  source: ${item.fl.url}${item.fl.layerId != null ? "/" + item.fl.layerId : ""}`);
    }

    setStatus(status, "Building the package…");
    let blob, filename;
    if (format === "kml") {
      zip.file("doc.kml", kmlDocument(`Selection ${date}`, kmlFolders.join("\n")));
      blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/vnd.google-earth.kmz" });
      filename = `selection_${date}.kmz`;
    } else {
      zip.file("README.txt", manifest.join("\r\n"));
      blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      filename = `selection_${date}.zip`;
    }
    const viaHelper = downloadBlob(blob, filename, dlWin);

    let msg = `Exported ${written.toLocaleString()} features from ${items.length} layer${items.length === 1 ? "" : "s"} into ${filename}.`;
    if (written < grand) msg += ` ${(grand - written).toLocaleString()} selected features no longer exist on the server and were skipped.`;
    if (isEmbedded && !viaHelper) msg += EMBED_HINT;
    setStatus(status, msg);
  }

  async function fetchForExport(fl, ids, format, onProgress) {
    const chunk = Math.min(fl.capabilities?.query?.maxRecordCount || 1000, 1000);
    const features = [];
    for (let i = 0; i < ids.length; i += chunk) {
      const q = fl.createQuery();
      q.where = "1=1";
      q.objectIds = ids.slice(i, i + chunk);
      q.outFields = ["*"];
      q.returnGeometry = format !== "csv" || fl.geometryType === "point";
      q.outSpatialReference = { wkid: 4326 };
      const r = await fl.queryFeatures(q);
      features.push(...r.features);
      onProgress?.(Math.min(i + chunk, ids.length));
    }
    return features;
  }

  function exportFields(fl) {
    return (fl.fields || []).filter((f) => !["geometry", "blob", "raster", "xml"].includes(f.type));
  }

  function serialize(format, features, fl, title) {
    const fields = exportFields(fl);
    if (format === "csv") return { text: toCsv(features, fields, fl.geometryType), ext: "csv", mime: "text/csv;charset=utf-8" };
    if (format === "kml") return { text: kmlDocument(title, kmlFolder(features, fields, fl, title, "#ffb400")), ext: "kml", mime: "application/vnd.google-earth.kml+xml" };
    return { text: JSON.stringify(toGeoJson(features, fields)), ext: "geojson", mime: "application/geo+json" };
  }

  function setProgress(p) { $("#exportProgress > div").style.width = `${Math.round(p * 100)}%`; }

  function formatValue(v, field) {
    if (v == null) return "";
    if (field.type === "date" && typeof v === "number") return new Date(v).toISOString();
    return v;
  }

  function toCsv(features, fields, geometryType) {
    const cols = fields.map((f) => f.name);
    const withXY = geometryType === "point";
    const header = withXY ? [...cols, "longitude", "latitude"] : cols;
    const esc = (v) => {
      const s = String(v);
      return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lines = [header.map(esc).join(",")];
    for (const f of features) {
      const row = fields.map((fd) => esc(formatValue(f.attributes[fd.name], fd)));
      if (withXY) row.push(f.geometry ? f.geometry.x : "", f.geometry ? f.geometry.y : "");
      lines.push(row.join(","));
    }
    return "\uFEFF" + lines.join("\r\n");   // BOM so Excel reads UTF-8 correctly
  }

  function toGeoJson(features, fields) {
    return {
      type: "FeatureCollection",
      features: features.map((f) => {
        const props = {};
        fields.forEach((fd) => (props[fd.name] = formatValue(f.attributes[fd.name], fd) === "" ? null : formatValue(f.attributes[fd.name], fd)));
        return { type: "Feature", geometry: geomToGeoJson(f.geometry), properties: props };
      })
    };
  }

  function geomToGeoJson(g) {
    if (!g) return null;
    switch (g.type) {
      case "point": return { type: "Point", coordinates: [g.x, g.y] };
      case "multipoint": return { type: "MultiPoint", coordinates: g.points.map((p) => [p[0], p[1]]) };
      case "polyline":
        return g.paths.length === 1
          ? { type: "LineString", coordinates: g.paths[0].map((p) => [p[0], p[1]]) }
          : { type: "MultiLineString", coordinates: g.paths.map((path) => path.map((p) => [p[0], p[1]])) };
      case "polygon": {
        // Esri: outer rings clockwise, holes counter-clockwise. GeoJSON wants the reverse.
        const polys = [];
        for (const ring of g.rings) {
          const coords = ring.map((p) => [p[0], p[1]]);
          if (isClockwise(coords) || !polys.length) polys.push([coords.reverse()]);
          else polys[polys.length - 1].push(coords.reverse());
        }
        return polys.length === 1 ? { type: "Polygon", coordinates: polys[0] } : { type: "MultiPolygon", coordinates: polys };
      }
      case "extent":
        return { type: "Polygon", coordinates: [[[g.xmin, g.ymin], [g.xmax, g.ymin], [g.xmax, g.ymax], [g.xmin, g.ymax], [g.xmin, g.ymin]]] };
      default: return null;
    }
  }

  function isClockwise(ring) {
    let sum = 0;
    for (let i = 0; i < ring.length - 1; i++) sum += (ring[i + 1][0] - ring[i][0]) * (ring[i + 1][1] + ring[i][1]);
    return sum > 0;
  }

  const xmlEsc = (v) => String(v).replace(/[<>&'"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;" }[c]));

  function kmlGeometry(g) {
    const coords = (pts) => pts.map((p) => `${p[0]},${p[1]}`).join(" ");
    const ring = (r) => `<LinearRing><coordinates>${coords(r)}</coordinates></LinearRing>`;
    const polygon = (rings) =>
      `<Polygon><outerBoundaryIs>${ring(rings[0])}</outerBoundaryIs>` +
      rings.slice(1).map((h) => `<innerBoundaryIs>${ring(h)}</innerBoundaryIs>`).join("") + `</Polygon>`;
    const gj = geomToGeoJson(g);   // lon/lat, exterior rings counter-clockwise (what KML expects)
    if (!gj) return "";
    switch (gj.type) {
      case "Point": return `<Point><coordinates>${gj.coordinates.join(",")}</coordinates></Point>`;
      case "MultiPoint": return `<MultiGeometry>${gj.coordinates.map((c) => `<Point><coordinates>${c.join(",")}</coordinates></Point>`).join("")}</MultiGeometry>`;
      case "LineString": return `<LineString><tessellate>1</tessellate><coordinates>${coords(gj.coordinates)}</coordinates></LineString>`;
      case "MultiLineString": return `<MultiGeometry>${gj.coordinates.map((l) => `<LineString><tessellate>1</tessellate><coordinates>${coords(l)}</coordinates></LineString>`).join("")}</MultiGeometry>`;
      case "Polygon": return polygon(gj.coordinates);
      case "MultiPolygon": return `<MultiGeometry>${gj.coordinates.map(polygon).join("")}</MultiGeometry>`;
      default: return "";
    }
  }

  // KML colors are aabbggrr
  function kmlColor(hex, alpha) { const [r, g, b] = hexToRgb(hex); const h = (n) => n.toString(16).padStart(2, "0"); return h(alpha) + h(b) + h(g) + h(r); }

  function kmlFolder(features, fields, fl, title, color) {
    const styleId = `s_${slug(title)}_${Math.random().toString(36).slice(2, 7)}`;
    const oid = fl.objectIdField;
    const nameField = labelFieldOf(fl);
    const placemarks = features.map((f) => {
      const a = f.attributes;
      const name = nameField && a[nameField] != null && a[nameField] !== "" ? a[nameField] : `Feature ${a[oid]}`;
      const data = fields.map((fd) => `<Data name="${xmlEsc(fd.name)}"><value>${xmlEsc(formatValue(a[fd.name], fd))}</value></Data>`).join("");
      return `<Placemark><name>${xmlEsc(name)}</name><styleUrl>#${styleId}</styleUrl><ExtendedData>${data}</ExtendedData>${kmlGeometry(f.geometry)}</Placemark>`;
    }).join("\n");
    return `<Folder><name>${xmlEsc(title)}</name>
<Style id="${styleId}">
  <IconStyle><color>${kmlColor(color, 255)}</color><scale>0.9</scale></IconStyle>
  <LineStyle><color>${kmlColor(color, 255)}</color><width>2.5</width></LineStyle>
  <PolyStyle><color>${kmlColor(color, 85)}</color></PolyStyle>
</Style>
${placemarks}
</Folder>`;
  }

  function kmlDocument(name, body) {
    return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
<name>${xmlEsc(name)}</name>
${body}
</Document>
</kml>`;
  }

  /* ---------------- Downloads ----------------
     The Experience Builder Embed widget sandboxes this page without allow-downloads,
     so a download started inside the iframe is blocked. It does allow popups that
     escape the sandbox, so when embedded we open a small helper window at click time
     (before any await, so pop-up blockers allow it) and start the download there. */

  const HELPER_STYLE = "font:16px system-ui,-apple-system,'Segoe UI',sans-serif;margin:24px;color:#1c2530";

  function openDownloadWindow() {
    if (!isEmbedded) return null;
    let w = null;
    try { w = window.open("", "_blank", "width=440,height=180"); } catch (e) { return null; }
    if (!w) return null;   // blocked by a pop-up blocker
    try {
      w.document.title = "Preparing export…";
      w.document.body.innerHTML = `<p style="${HELPER_STYLE}">Preparing your export… This window closes on its own.</p>`;
      return w;
    } catch (e) {
      try { w.close(); } catch (_) {}
      return null;         // not scriptable from here; fall back to a direct download
    }
  }

  function closeDownloadWindow(w) {
    if (w && !w.closed && !w.__exporterUsed) { try { w.close(); } catch (e) {} }
  }

  function downloadBlob(blob, filename, helperWin) {
    const target = helperWin && !helperWin.closed ? helperWin : window;
    const doc = target.document;
    const url = target.URL.createObjectURL(blob);
    const a = doc.createElement("a");
    a.href = url;
    a.download = filename;
    doc.body.appendChild(a); a.click(); a.remove();

    if (target !== window) {
      target.__exporterUsed = true;
      target.document.title = "Download started";
      doc.body.innerHTML = `<p style="${HELPER_STYLE}">Downloading ${escapeHtml(filename)}. This window closes on its own.</p>`;
      setTimeout(() => { try { target.close(); } catch (e) {} }, 4000);
    } else {
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    return target !== window;
  }

  /* ---------------- Helpers ---------------- */
  function setStatus(el, text, isError = false) { el.textContent = text; el.classList.toggle("error", isError); }
  function slug(s) { return String(s).replace(/[^\w\-]+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "").slice(0, 80) || "export"; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------------- Start ---------------- */
  (async function start() {
    renderAll();
    try {
      state.portal = await signIn();
      if (state.portal.user) {
        $("#userName").textContent = state.portal.user.username;
        $("#userBox").hidden = false;
      }
    } catch (e) {
      console.error(e);
      $("#groupName").textContent = "Sign-in required";
      setGroupStatus("Couldn't sign in to ArcGIS. Reload the page to try again.");
      return;
    }

    // Always-on layers from config
    for (const url of cfg.layers || []) {
      try { await addTopLayer(await Layer.fromArcGISServerUrl({ url }), "config", null); }
      catch (e) { console.warn("Could not load configured layer", url, e); }
    }

    await initGroupPortal(state.portal);
    renderAll();
  })();
});
</script>
</body>
</html>
